name: API contract check

# contract: fails if any endpoint documented under docs/api/ or docs/lens/api/
#   does not exist in the real API surface, or a curl example uses an unknown
#   query param (scripts/openapi-snapshot.json).
#   Refresh the snapshot with the command in scripts/check-api-contract.mjs's
#   header whenever the API adds/renames endpoints or query params.
# ui-claims: fails if docs reference dashboard routes or Site Settings tabs
#   that don't exist in the dashboard (scripts/ui-manifest.json — committed;
#   CI never needs the dashboard repo). Refresh it locally with
#   `npm run generate:ui-manifest` (see scripts/generate-ui-manifest.mjs).
# product-claims: fails if docs or blog posts ASSERT a capability we don't have
#   (scripts/capability-ledger.json). The two checks above validate references —
#   does the endpoint exist, does the screen exist — and both passed while
#   published pages claimed SSO, user journeys, exit pages and IP-based
#   geolocation. None of those is a broken reference; they are false statements.
#   Edit the ledger, not this file, when a capability ships or is retired.
# Security note: no untrusted event data is interpolated in run commands.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'scripts/check-api-contract.mjs'
      - 'scripts/openapi-snapshot.json'
      - 'scripts/check-ui-claims.mjs'
      - 'scripts/ui-manifest.json'
      - 'scripts/check-product-claims.mjs'
      - 'scripts/capability-ledger.json'
      - 'static/openapi.json'
      - 'redocly.yaml'
      - 'scripts/check-geo.mjs'
      - 'scripts/llms-templates/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'scripts/check-api-contract.mjs'
      - 'scripts/openapi-snapshot.json'
      - 'scripts/check-ui-claims.mjs'
      - 'scripts/ui-manifest.json'
      - 'scripts/check-product-claims.mjs'
      - 'scripts/capability-ledger.json'
      - 'static/openapi.json'
      - 'redocly.yaml'
      - 'scripts/check-geo.mjs'
      - 'scripts/llms-templates/**'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check documented endpoints against the API spec
        run: node scripts/check-api-contract.mjs

  ui-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check documented dashboard routes and tabs against the UI manifest
        run: node scripts/check-ui-claims.mjs

  product-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check feature claims against the capability ledger
        run: node scripts/check-product-claims.mjs

  geo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Unclosed code fences (silently truncate a page and its llms mirror),
      # duplicate titles, and stale docs-raw / .md mirrors of deleted pages.
      - name: Check GEO hygiene (fences, duplicate titles, stale mirrors)
        run: node scripts/check-geo.mjs

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails on any OpenAPI error. The rules downgraded to `warn` in
      # redocly.yaml are API-side route defects, documented in that file.
      - name: Lint the published OpenAPI document
        run: npx --yes @redocly/cli@latest lint static/openapi.json
