name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Only one deploy at a time. Every push to main starts a run, and each run
# ends by pushing the built site to gh-pages — so runs that overlap race for
# that branch and all but the first are rejected with "fetch first".
# cancel-in-progress: false lets the running deploy finish its push instead
# of being killed mid-write; later runs queue behind it.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
