name: Daily LLMs.txt Regeneration

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  workflow_dispatch: # Allow manual trigger

# main requires a PR (repository ruleset), so the job pushes to a branch and
# opens a PR instead of pushing to main.
permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate llms.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate llms.txt files
        run: node scripts/generate-llms.mjs

      # The generator never purges mirrors of deleted pages; this does.
      - name: Remove stale mirrors
        run: node scripts/check-geo.mjs --fix

      - name: Check for changes
        id: diff
        run: |
          # --porcelain (not diff) so new Markdown mirrors are picked up too.
          changed_files=$(git status --porcelain -- static/llms.txt static/llms-full.txt static/docs-raw static/knowledge-manifest.json)
          changed_markdown=$(git status --porcelain -- ':(glob)static/*.md' ':(glob)static/**/*.md')
          printf '%s\n%s\n' "$changed_files" "$changed_markdown"
          changed=$(printf '%s\n%s\n' "$changed_files" "$changed_markdown" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # One branch reused by every run: an unmerged PR from a previous day is
      # overwritten with today's output instead of piling up a new PR.
      - name: Commit and open PR
        if: steps.diff.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto/regenerate-llms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add static/llms.txt static/llms-full.txt static/docs-raw static/knowledge-manifest.json
          find static -type f -name '*.md' -print0 | xargs -0 -r git add --
          git commit -m "chore: auto-regenerate LLM knowledge mirrors"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            # The sealmetrics org does not let Actions create PRs, so this can
            # fail. The job then fails on purpose (so someone is notified) and
            # leaves the link to open the PR by hand.
            if ! gh pr create --base main --head "$BRANCH" \
              --title "chore: auto-regenerate LLM knowledge mirrors" \
              --body "Daily regeneration of llms.txt, llms-full.txt, docs-raw and the Markdown mirrors. Generated by the Daily LLMs.txt Regeneration workflow."; then
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
              echo "Regenerated mirrors are on \`$BRANCH\` but the PR could not be created. Open it by hand: $url" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Could not create the PR. Open it by hand: $url"
              exit 1
            fi
          fi
