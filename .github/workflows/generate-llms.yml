name: Daily LLMs.txt Regeneration

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate llms.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate llms.txt files
        run: node scripts/generate-llms.mjs

      # The generator never purges mirrors of deleted pages; this does.
      - name: Remove stale mirrors
        run: node scripts/check-geo.mjs --fix

      - name: Check for changes
        id: diff
        run: |
          # --porcelain (not diff) so new Markdown mirrors are picked up too.
          changed_files=$(git status --porcelain -- static/llms.txt static/llms-full.txt static/docs-raw static/knowledge-manifest.json)
          changed_markdown=$(git status --porcelain -- ':(glob)static/*.md' ':(glob)static/**/*.md')
          printf '%s\n%s\n' "$changed_files" "$changed_markdown"
          changed=$(printf '%s\n%s\n' "$changed_files" "$changed_markdown" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/llms.txt static/llms-full.txt static/docs-raw static/knowledge-manifest.json
          find static -type f -name '*.md' -print0 | xargs -0 -r git add --
          git commit -m "chore: auto-regenerate LLM knowledge mirrors"
          git push
