# Lint config for the published OpenAPI document (static/openapi.json).
#
#   npm run check:openapi
#
# Two rules are downgraded to `warn` because the finding is a real defect in the
# API's route design, not in the document — fixing it here would make the spec
# describe an API that doesn't exist. Both are fixed in the sealmetrics2 API repo,
# not here:
#
#   · no-identical-paths   /sites/{site_id}/utm-mappings/{mapping_id}
#                          vs /sites/{site_id}/utm-mappings/{custom_param}
#   · no-ambiguous-paths   e.g. /shared-dashboards/{dashboard_id}/embed
#                          vs /shared-dashboards/public/{share_token}
#
# Restore both to `error` as soon as the API routes are renamed.
#
# `operation-4xx-response` is off for /livez and /readyz only: Kubernetes probes
# answer 200 or 503 and have no meaningful 4xx.

extends:
  - recommended

apis:
  sealmetrics:
    root: static/openapi.json

rules:
  no-identical-paths: warn
  no-ambiguous-paths: warn
  operation-4xx-response:
    severity: warn
